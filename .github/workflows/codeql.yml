name: "CodeQL Security Scanning"

on:
  push:
    branches:
      - candidate
      - develop
      - mainline
  pull_request:
    branches:
      - candidate
      - develop
      - mainline
  schedule:
    # Weekly scan on Fridays at 6:34 PM UTC
    - cron: '34 18 * * 5'

jobs:
  analyze:
    name: Analyze (C/C++)
    runs-on: ubuntu-latest
    container: rocm/dev-ubuntu-22.04:latest@sha256:6c11663a93966c040cd56dc73ed6d6761cdb887068f3f8940c4d3fe4e6829f10   # 10.1.0-full
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Install OS requirements
        timeout-minutes: 10
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake libnuma-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Build TransferBench
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DBUILD_LOCAL_GPU_TARGET_ONLY=ON \
                   -DENABLE_NIC_EXEC=OFF \
                   -DENABLE_MPI_COMM=OFF \
                   -DCMAKE_PREFIX_PATH=/opt/rocm
          make -j $(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:c-cpp"
